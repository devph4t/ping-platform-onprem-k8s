# Platform UI: three single-page apps under one server (behind the k8s ingress).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    # Relative Location headers: behind the TLS ingress an absolute
    # http://<host>:8080/... redirect would be wrong (seen in test).
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Health check for k8s probes
    location = /healthz { access_log off; return 200 "ok\n"; }

    location = / { return 302 /platform/; }
    location = /platform { return 302 /platform/; }
    location = /enduser  { return 302 /enduser/; }
    location = /login    { return 302 /login/; }

    # index.html must never be cached (bundle names change between versions)
    location ~ ^/(platform|enduser|login)/index\.html$ {
        add_header Cache-Control "no-store";
    }

    location /platform/ { try_files $uri $uri/ /platform/index.html; }
    location /enduser/  { try_files $uri $uri/ /enduser/index.html; }
    location /login/    { try_files $uri $uri/ /login/index.html; }
}
